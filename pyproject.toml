[project]
name = "engram"
version = "3.0.0"
description = "Persistent memory MCP server for development with Claude Code"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
    "sqlite-vec>=0.1.3",
    "portalocker>=2.8",
    "python-ulid>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "watchdog>=4.0",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
clustering = ["python-igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
engram = "engram.cli:app"
engram-server = "engram.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["engram*"]
